<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CannaNet Cyber-Roots Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #050811; color: #f8fafc; font-family: monospace; overflow: hidden; margin: 0; }
    canvas { display: block; }
    .glass-panel { background: rgba(10, 16, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.25); }
    .glow-text { text-shadow: 0 0 10px rgba(16, 185, 129, 0.8); }
  </style>
</head>
<body class="w-screen h-screen relative select-none">

  <!-- HUD Top Bar -->
  <div class="absolute top-4 left-4 z-20 flex items-center gap-3 glass-panel px-4 py-2.5 rounded-xl">
    <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
    <div>
      <h1 class="text-xs font-bold tracking-widest text-emerald-400 glow-text">CANNANET // ROOT MATRIX</h1>
      <p class="text-[10px] text-slate-400">STATUS: OPERATIONAL | 3 SPECTRUM ZONES</p>
    </div>
  </div>

  <!-- Microscopic Lens / Trichome Sidebar (Revealed on Node Click) -->
  <div id="inspectorHUD" class="absolute top-4 right-4 z-20 w-80 glass-panel rounded-2xl p-4 transition-all duration-500 opacity-0 pointer-events-none translate-x-10">
    <div class="flex justify-between items-center border-b border-emerald-900/50 pb-2 mb-3">
      <span class="text-xs font-bold text-emerald-300 tracking-wider">MICROSCOPIC INSPECTION</span>
      <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-xs">✕</button>
    </div>

    <!-- Live Cellular Trichome Canvas -->
    <div class="relative w-full h-40 bg-slate-950 rounded-xl overflow-hidden border border-emerald-500/30 mb-3">
      <canvas id="trichomeCanvas" class="w-full h-full"></canvas>
      <div class="absolute inset-0 pointer-events-none border border-dashed border-emerald-500/20 rounded-xl"></div>
      <div class="absolute bottom-2 left-2 text-[9px] text-emerald-400/80 font-mono">[ CAPITATE-STALKED 200X ]</div>
    </div>

    <div class="space-y-2 text-xs">
      <div class="flex justify-between"><span class="text-slate-400">SELECTED NODE:</span><span id="nodeName" class="text-emerald-300 font-bold">--</span></div>
      <div class="flex justify-between"><span class="text-slate-400">HEALTH INDEX:</span><span id="nodeHealth" class="text-cyan-400">98.4%</span></div>
      <div class="flex justify-between"><span class="text-slate-400">THC POTENCY:</span><span id="nodeTHC" class="text-purple-400">28.5%</span></div>
      <div class="flex justify-between"><span class="text-slate-400">TRICHOME MATURITY:</span><span class="text-amber-400">80% MILKY / 20% AMBER</span></div>
    </div>
  </div>

  <!-- Main Radial Network Canvas -->
  <canvas id="networkCanvas" class="w-full h-full"></canvas>

  <script>
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const inspectorHUD = document.getElementById('inspectorHUD');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initNodes();
    });

    let nodes = [];
    let veins = [];
    let particles = [];
    let camera = { x: 0, y: 0, zoom: 1, targetX: 0, targetY: 0, targetZoom: 1 };

    function initNodes() {
      nodes = [];
      veins = [];
      
      const center = { id: 'core', label: 'CANNANET CORE', x: 0, y: 0, r: 35, type: 'core', color: '#10b981' };
      nodes.push(center);

      const groups = [
        { id: 'sativa', label: 'SATIVAS', angle: -Math.PI / 2, dist: 180, color: '#06b6d4' },
        { id: 'indica', label: 'INDICAS', angle: (Math.PI * 5) / 6, dist: 180, color: '#a855f7' },
        { id: 'hybrid', label: 'HYBRIDS', angle: Math.PI / 6, dist: 180, color: '#10b981' }
      ];

      const strainData = {
        sativa: ['Sour Diesel', 'Blue Dream', 'Ghost Train Haze', 'Super Lemon Haze'],
        indica: ['OG Kush', 'Granddaddy Purple', 'Northern Lights', 'Bubba Kush'],
        hybrid: ['Gelato #33', 'Wedding Cake', 'Runtz', 'Gorilla Glue']
      };

      groups.forEach((g) => {
        const gx = Math.cos(g.angle) * g.dist;
        const gy = Math.sin(g.angle) * g.dist;
        const groupNode = { id: g.id, label: g.label, x: gx, y: gy, r: 24, type: 'group', color: g.color };
        nodes.push(groupNode);
        veins.push({ from: center, to: groupNode, color: g.color, width: 4 });

        const strains = strainData[g.id];
        strains.forEach((st, i) => {
          const spread = 0.8;
          const subAngle = g.angle + (i - (strains.length - 1) / 2) * (spread / strains.length);
          const subDist = 140;
          const sx = gx + Math.cos(subAngle) * subDist;
          const sy = gy + Math.sin(subAngle) * subDist;
          const strainNode = { id: `${g.id}-${i}`, label: st, x: sx, y: sy, r: 16, type: 'strain', color: g.color };
          nodes.push(strainNode);
          veins.push({ from: groupNode, to: strainNode, color: g.color, width: 2 });
        });
      });

      // Energy particles pulsing through veins
      particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          veinIdx: Math.floor(Math.random() * veins.length),
          progress: Math.random(),
          speed: 0.003 + Math.random() * 0.005
        });
      }
    }

    initNodes();

    // Render loop
    function animate() {
      // Smooth camera pan/zoom interpolation
      camera.x += (camera.targetX - camera.x) * 0.08;
      camera.y += (camera.targetY - camera.y) * 0.08;
      camera.zoom += (camera.targetZoom - camera.zoom) * 0.08;

      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Draw Grid Background
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = -width; x < width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, -height); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = -height; y < height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(-width, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Draw Curved Veins
      veins.forEach((v) => {
        ctx.beginPath();
        ctx.moveTo(v.from.x, v.from.y);
        const midX = (v.from.x + v.to.x) / 2 + (v.from.y - v.to.y) * 0.15;
        const midY = (v.from.y + v.to.y) / 2 + (v.to.x - v.from.x) * 0.15;
        ctx.quadraticCurveTo(midX, midY, v.to.x, v.to.y);
        ctx.strokeStyle = v.color;
        ctx.lineWidth = v.width;
        ctx.shadowColor = v.color;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      // Flowing Nutrient Particles
      particles.forEach((p) => {
        p.progress += p.speed;
        if (p.progress >= 1) p.progress = 0;
        const v = veins[p.veinIdx];
        const midX = (v.from.x + v.to.x) / 2 + (v.from.y - v.to.y) * 0.15;
        const midY = (v.from.y + v.to.y) / 2 + (v.to.x - v.from.x) * 0.15;
        
        const t = p.progress;
        const px = (1 - t) * (1 - t) * v.from.x + 2 * (1 - t) * t * midX + t * t * v.to.x;
        const py = (1 - t) * (1 - t) * v.from.y + 2 * (1 - t) * t * midY + t * t * v.to.y;

        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = v.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw Nodes
      nodes.forEach((n) => {
        const grad = ctx.createRadialGradient(n.x, n.y, 2, n.x, n.y, n.r + 8);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, n.color);
        grad.addColorStop(1, 'rgba(5, 8, 17, 0.8)');

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.shadowColor = n.color;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Label
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(n.label.toUpperCase(), n.x, n.y + n.r + 16);
      });

      ctx.restore();
      requestAnimationFrame(animate);
    }

    animate();

    // Node Inspection Click Listener
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left - width / 2;
      const clickY = e.clientY - rect.top - height / 2;

      // Transform click coordinates based on zoom/pan
      const transformedX = (clickX - camera.x) / camera.zoom;
      const transformedY = (clickY - camera.y) / camera.zoom;

      let clickedNode = nodes.find(n => Math.hypot(n.x - transformedX, n.y - transformedY) < n.r + 10);

      if (clickedNode) {
        camera.targetX = -clickedNode.x * 1.5;
        camera.targetY = -clickedNode.y * 1.5;
        camera.targetZoom = 1.8;

        document.getElementById('nodeName').innerText = clickedNode.label;
        document.getElementById('nodeHealth').innerText = (95 + Math.random() * 4).toFixed(1) + '%';
        document.getElementById('nodeTHC').innerText = (22 + Math.random() * 8).toFixed(1) + '%';

        inspectorHUD.classList.remove('opacity-0', 'pointer-events-none', 'translate-x-10');
        renderTrichomes();
      } else {
        closeInspector();
      }
    });

    function closeInspector() {
      camera.targetX = 0;
      camera.targetY = 0;
      camera.targetZoom = 1;
      inspectorHUD.classList.add('opacity-0', 'pointer-events-none', 'translate-x-10');
    }

    // Microscopic Trichome Generator Canvas
    function renderTrichomes() {
      const tCanvas = document.getElementById('trichomeCanvas');
      const tCtx = tCanvas.getContext('2d');
      tCanvas.width = tCanvas.parentElement.clientWidth;
      tCanvas.height = tCanvas.parentElement.clientHeight;

      tCtx.fillStyle = '#020617';
      tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);

      for (let i = 0; i < 18; i++) {
        const x = 20 + Math.random() * (tCanvas.width - 40);
        const y = tCanvas.height - 10;
        const h = 40 + Math.random() * 50;

        // Trichome Stalk
        tCtx.beginPath();
        tCtx.moveTo(x, y);
        tCtx.lineTo(x, y - h);
        tCtx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
        tCtx.lineWidth = 4;
        tCtx.stroke();

        // Glandular Resin Head
        tCtx.beginPath();
        tCtx.arc(x, y - h - 6, 8 + Math.random() * 4, 0, Math.PI * 2);
        tCtx.fillStyle = Math.random() > 0.3 ? '#fef08a' : '#38bdf8';
        tCtx.shadowColor = tCtx.fillStyle;
        tCtx.shadowBlur = 12;
        tCtx.fill();
        tCtx.shadowBlur = 0;
      }
    }
  </script>
</body>
</html>
